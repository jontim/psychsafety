<html lang="en">
<head>

      border-bottom: 4px solid #F9F9F9;
    }

    .header-content {

      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 1rem;
      position: relative;
    }
    
    .header-title {
      color: white;

      margin-right: auto; /* Pushes the title to the left */

      display: flex;
      align-items: center;
    }
    
    .header-logo {
      height: 45px;
      width: auto;

      padding-right: 0.5rem;

      font-size: 2rem;
      color: white;

      position: relative;

      font-weight: 700;
      font-size: 2rem;

      text-align: center;

<script>
  // Global variables
  let widgetScriptLoaded = false;
  let sessionActive = false;
  let coachVideoVisible = false;
  let dynamicVariables = {};
  
  // Function to show status messages
  function showStatus(message, type = 'connecting') {
    const statusDot = document.querySelector('.status-dot');
    const statusText = document.querySelector('.status-text');
    
    statusDot.className = 'status-dot ' + type;
    statusText.textContent = message;
  }
  
  // Function to load the ElevenLabs widget script with advanced retry and fallback mechanisms
  function loadWidgetScript(retryCount = 0, maxRetries = 5) {
    return new Promise((resolve, reject) => {
      // Check if already loaded
      if (widgetScriptLoaded || customElements.get('elevenlabs-convai')) {
        console.log('ElevenLabs widget already loaded');
        widgetScriptLoaded = true;
        resolve();
        return;
      }

      // Exit condition after maximum retries
      if (retryCount >= maxRetries) {
        console.error(`Failed to load widget script after ${maxRetries} attempts`);
        reject(new Error(`Failed to load widget script after ${maxRetries} attempts`));
        return;
      }

      // Calculate backoff delay with jitter
      const baseDelay = Math.pow(2, retryCount) * 1000;
      const jitter = baseDelay * (0.5 + Math.random() * 0.5);
      
      // Try multiple known working URLs
      const urls = [
        'https://elevenlabs.io/convai-widget/index.js',
        'https://widget.elevenlabs.io/widget.js',
        'https://cdn.elevenlabs.io/convai-widget/index.js',
        'https://elevenlabs.io/static/js/widget.js'
      ];
      
      // Try to load through multiple methods
      const urlToTry = urls[retryCount % urls.length];
      console.log(`Attempting to load widget script from: ${urlToTry} (attempt ${retryCount + 1}/${maxRetries})`);
      
      // Method 1: Try direct script injection first
      try {
        const script = document.createElement('script');
        script.id = `elevenlabs-widget-script-${retryCount}`;
        script.async = true;
        script.src = `${urlToTry}?v=${Date.now()}`; // Add cache-busting parameter
        
        script.onload = () => {
          console.log(`Widget script loaded successfully from: ${urlToTry}`);
          widgetScriptLoaded = true;
          resolve();
        };
        
        script.onerror = () => {
          console.error(`Direct script load failed from ${urlToTry}`);
          
          // Method 2: Try loading via fetch first to bypass potential CORS issues
          console.log(`Attempting fetch-then-inject for ${urlToTry}`);
          
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 second timeout
          
          fetch(`${urlToTry}?nocache=${Date.now()}`, {
            signal: controller.signal,
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache',
              'Expires': '0'
            }
          })
          .then(response => {
            clearTimeout(timeoutId);
            if (!response.ok) {
              throw new Error(`Network response was not ok: ${response.status}`);
            }
            return response.text();
          })
          .then(code => {
            // Create and inject script from fetched code
            const inlineScript = document.createElement('script');
            inlineScript.id = `elevenlabs-widget-inline-${retryCount}`;
            inlineScript.textContent = code;
            document.head.appendChild(inlineScript);
            
            // Check if the widget was successfully loaded
            setTimeout(() => {
              if (customElements.get('elevenlabs-convai')) {
                console.log('Widget loaded via fetch-then-inject method');
                widgetScriptLoaded = true;
                resolve();
              } else {
                console.error('Widget did not load via fetch-then-inject method');
                // Try the next approach with delay
                setTimeout(() => {
                  loadWidgetScript(retryCount + 1, maxRetries).then(resolve).catch(reject);
                }, jitter);
              }
            }, 500);
          })
          .catch(error => {
            clearTimeout(timeoutId);
            console.error('Fetch-then-inject failed:', error);
            // Try the next approach with delay
            setTimeout(() => {
              loadWidgetScript(retryCount + 1, maxRetries).then(resolve).catch(reject);
            }, jitter);
          });
        };
        
        // Remove any existing widget scripts to avoid conflicts
        document.querySelectorAll('script[src*="convai-widget"], script[src*="widget.elevenlabs"]').forEach(s => {
          if (s.id !== script.id) s.remove();
        });
        
        document.head.appendChild(script);
      } catch (error) {
        console.error('Error during script creation:', error);
        setTimeout(() => {
          loadWidgetScript(retryCount + 1, maxRetries).then(resolve).catch(reject);
        }, jitter);
      }
    });
  }
  
  // Function to fetch widget configuration from ElevenLabs API with enhanced retry mechanism
  async function getWidgetConfig(agentId) {
    let retryCount = 0;
    const maxRetries = 3; // Increased from 2 to 3 for better resilience
    const timeoutMs = 15000; // 15 second timeout - balance between responsiveness and waiting for slow responses
    
    async function attemptFetch() {
      try {
        console.log(`Widget config fetch attempt ${retryCount + 1}/${maxRetries + 1} for agent: ${agentId}`);
        
        // Use our cloud function as a proxy to avoid CORS issues and hide API key
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
        
        const response = await fetch(`https://us-central1-psychsafety.cloudfunctions.net/getWidgetConfig?agentId=${agentId}`, {
          signal: controller.signal,
          headers: {
            'Cache-Control': 'no-cache',
            'Pragma': 'no-cache'
          }
        });
        
        clearTimeout(timeoutId);
        
        if (!response.ok) {
          const errorText = await response.text().catch(() => 'No response body');
          console.warn(`Non-OK response from widget config API: Status ${response.status}`, { 
            statusText: response.statusText, 
            body: errorText.substring(0, 200) // Truncate long error responses
          });
          throw new Error(`Failed to fetch widget config: ${response.status} ${response.statusText}`);
        }
        
        // Parse JSON safely
        let data;
        try {
          const jsonText = await response.text();
          data = JSON.parse(jsonText);
        } catch (parseError) {
          console.error('JSON parsing error for widget config:', parseError);
          throw new Error(`Invalid JSON response: ${parseError.message}`);
        }
        
        console.log('Successfully retrieved widget config');
        return data.widget_config;
      } catch (error) {
        // More granular error classification
        const isNetworkError = error.name === 'TypeError' || 
                              error.message.includes('network') ||
                              error.message.includes('fetch');
        
        const isTimeoutError = error.name === 'AbortError' || 
                              error.message.includes('aborted') ||
                              error.message.includes('timeout');
        
        const isProtocolError = error.name === 'ProtocolError' || 
                               error.message.includes('protocol');
                               
        const isPrematureTermination = error.message.includes('prematurely') ||
                                      error.message.includes('chunked');
        
        // Specific error logging based on error type
        if (isNetworkError) {
          console.warn(`Network error during widget config fetch (attempt ${retryCount + 1}/${maxRetries + 1}):`, error.message);
        } else if (isTimeoutError) {
          console.warn(`Timeout error during widget config fetch (attempt ${retryCount + 1}/${maxRetries + 1}):`, error.message);
        } else if (isProtocolError || isPrematureTermination) {
          console.warn(`Protocol/Chunking error during widget config fetch (attempt ${retryCount + 1}/${maxRetries + 1}):`, error.message);
        } else {
          console.error(`Widget config fetch attempt ${retryCount + 1}/${maxRetries + 1} failed:`, error);
        }
        
        const isRetryableError = isNetworkError || isTimeoutError || isProtocolError || isPrematureTermination;
        
        if (retryCount < maxRetries && isRetryableError) {
          // Enhanced exponential backoff with jitter
          const baseDelay = Math.pow(2, retryCount) * 1000;
          // Add more jitter to avoid thundering herd problem (50-100% of base delay)
          const jitter = baseDelay + (baseDelay * Math.random() * 0.5);
          console.log(`Retrying widget config fetch in ${Math.round(jitter / 1000)} seconds...`);
          
          retryCount++;
          await new Promise(resolve => setTimeout(resolve, jitter));
          return attemptFetch();
        } else {
          // After all retries failed, return a default configuration with a debug message
          console.warn('All widget config fetch attempts failed, using default config');
          return {
            variant: 'compact',
            expandable: 'never',
            feedback_mode: 'none',
            show_avatar_when_collapsed: true,
            _debug_info: {
              error: error.message,
              agent_id: agentId,
              attempts: retryCount + 1
            }
          };
        }
      }
    }
    
    return attemptFetch();
  }
  
  // Function to get conversation details from past conversations
  async function getConversationDetails(agentId, userId) {
    let retryCount = 0;
    const maxRetries = 3;
    const timeoutMs = 15000;
    
    async function attemptFetch() {
      try {
        console.log(`Conversation details fetch attempt ${retryCount + 1}/${maxRetries + 1} for agent: ${agentId} and user: ${userId}`);
        
        // Ensure we have a valid user ID for privacy protection
        const safeUserId = userId || 'anonymous_user_' + Math.random().toString(36).substring(2, 10);
        
        // Prepare the request payload - IMPORTANT: include userId for privacy filtering
        const requestData = {
          data: {
            agentId: agentId,
            userId: safeUserId
          }
        };
        
        console.log('Sending request to get conversation details:', requestData);
        
        // Use the cloud function to get conversation details with proper timeout
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
        
        const response = await fetch('https://us-central1-psychsafety.cloudfunctions.net/getConversationDetails', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Cache-Control': 'no-cache'
          },
          body: JSON.stringify(requestData),
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if (!response.ok) {
          const errorText = await response.text().catch(() => 'No response body');
          console.warn(`Non-OK response from conversation API: Status ${response.status}`, { 
            statusText: response.statusText, 
            body: errorText.substring(0, 200) // Truncate long responses
          });
          throw new Error(`Failed to fetch conversation: ${response.status} ${response.statusText}`);
        }
        
        // Parse the response
        const data = await response.json();
        console.log('Retrieved conversation details:', data);
        
        return data;
      } catch (error) {
        // Detailed error classification for better debugging
        const isNetworkError = error.name === 'TypeError' || 
                              error.message.includes('network') ||
                              error.message.includes('fetch');
        
        const isTimeoutError = error.name === 'AbortError' || 
                              error.message.includes('aborted') ||
                              error.message.includes('timeout');
        
        const isProtocolError = error.name === 'ProtocolError' || 
                               error.message.includes('protocol');
                               
        const isPrematureTermination = error.message.includes('prematurely') ||
                                      error.message.includes('chunked');
        
        // Specific error logging based on error type
        if (isNetworkError) {
          console.warn(`Network error during conversation details fetch (attempt ${retryCount + 1}/${maxRetries + 1}):`, error.message);
        } else if (isTimeoutError) {
          console.warn(`Timeout error during conversation details fetch (attempt ${retryCount + 1}/${maxRetries + 1}):`, error.message);
        } else if (isProtocolError || isPrematureTermination) {
          console.warn(`Protocol/Chunking error during conversation details fetch (attempt ${retryCount + 1}/${maxRetries + 1}):`, error.message);
        } else {
          console.error(`Conversation details fetch attempt ${retryCount + 1}/${maxRetries + 1} failed:`, error);
        }
        
        const isRetryableError = isNetworkError || isTimeoutError || isProtocolError || isPrematureTermination;
        
        if (retryCount < maxRetries && isRetryableError) {
          // Enhanced exponential backoff with jitter to prevent thundering herd
          const baseDelay = Math.pow(2, retryCount) * 1000;
          const jitter = baseDelay + (baseDelay * Math.random() * 0.5);
          console.log(`Retrying conversation details fetch in ${Math.round(jitter / 1000)} seconds...`);
          
          retryCount++;
          await new Promise(resolve => setTimeout(resolve, jitter));
          return attemptFetch();
        } else {
          // After all retries failed
          console.warn('All conversation details fetch attempts failed');
          throw error; // Re-throw to be handled by caller
        }
      }
    }
    
    return attemptFetch();
  }
  
  // Function to initialize the coaching widget
  function initializeCoachingWidget(coachId, dynamicVars) {
    return new Promise((resolve, reject) => {
      // Debug info on the selected coach
      console.log(`Coach selected: ${coachId}, trying to load widget...`);
      
      // Map coach IDs to their corresponding Convai agent IDs with correct IDs
      const agentIds = {
        niles: "rI4k2913KxCBlbFr2Imx",     // Updated correct ID
        caroline: "yQ8hyEeT84QfbXK1k6qG",   // Already correct
        lorraine: "xklKUaa1IPvcOBJAsfli",  // Updated correct ID
        mathew: "tf6c7I8annF0etPiL4vG",    // Updated correct ID
        taylor: "YQlxYRZlqVjnhpQZzYM2",
        daryl: "3pR429Vw6aUH1tLHvJXX",
        priya: "L6nqkfKV2kOIpSoDRQ2e",
        alex: "cNYjN0sG42sEaYJwQyjQ"
      };
      
      console.log(`Using agent ID mapping for coach: ${coachId}`);
      console.log('Available agent IDs:', JSON.stringify(agentIds, null, 2));
      
      // Normalize coach ID to lowercase for consistency with agent ID keys
      const normalizedCoachId = coachId.toLowerCase();
      let agentId = agentIds[normalizedCoachId]; // Make this a let instead of const so we can reassign
      
      // Use the specific agent ID if found, or fall back to niles as default
      if (!agentId) {
        console.warn(`No agent ID found for coach: ${coachId}, falling back to niles`);
        // Use niles as fallback
        agentId = agentIds['niles'];
      }
      
      if (!agentId) {
        reject(new Error('Invalid agent ID'));
        return;
      }
      
      console.log(`Using agent ID: ${agentId} for coach: ${normalizedCoachId}`);

      // Get the widget container
      const widgetContainer = document.getElementById('coaching-widget');
      if (!widgetContainer) {
        reject(new Error('Widget container not found'));
        return;
      }

      try {
        // Clear any existing content
        widgetContainer.innerHTML = '';
        
        // Remove any existing widget elements
        document.querySelectorAll('elevenlabs-convai').forEach(widget => {
          if (widget.id !== 'coaching-widget-element') {
            widget.remove();
          }
        });
        
        // Ensure user ID is in the dynamic variables
        if (!dynamicVars.user_id) {
          let userId = localStorage.getItem('userId');
          if (!userId) {
            userId = `user_${Math.random().toString(36).substring(2, 15)}`;
            localStorage.setItem('userId', userId);
          }
          dynamicVars.user_id = userId;
        }
        
        // Create dynamic variables JSON
        const dynamicVarsJson = JSON.stringify(dynamicVars);
        
        // Clean up widget container thoroughly first
        widgetContainer.innerHTML = ''; // Clear container
        
        // Remove any stray widgets in the document
        const existingWidgets = document.querySelectorAll('elevenlabs-convai');
        if (existingWidgets.length > 0) {
          console.log(`Removing ${existingWidgets.length} existing widget elements`);
          existingWidgets.forEach(w => w.remove());
        }
        
        // Create the widget element EXACTLY as in the working implementation
        console.log(`Creating new widget with agent ID: ${agentId}`);
        const newWidget = document.createElement('elevenlabs-convai');
        newWidget.id = 'coaching-widget-element';
        
        // KEEP IT SIMPLE - only set the essential attributes as done in the working version
        newWidget.setAttribute('agent-id', agentId);
        
        // Associate widget with user ID
        newWidget.setAttribute('data-user-id', dynamicVars.user_id);
        
        // Set each variable individually as data attributes instead of using the dynamic-variables attribute
        // This can help avoid parsing errors in the widget
        Object.entries(dynamicVars).forEach(([key, value]) => {
          if (typeof value === 'string') {
            // For string values, set them directly as data attributes
            newWidget.setAttribute(`data-${key.replace('_', '-')}`, value);
          }
        });
        
        // As a fallback, also try the standard dynamic-variables approach
        try {
          newWidget.setAttribute('dynamic-variables', dynamicVarsJson);
        } catch (e) {
          console.warn('Failed to set dynamic-variables attribute:', e);
        }
        
        // Additional basic attributes
        newWidget.setAttribute('enable-history', 'true');
        newWidget.setAttribute('hide-branding', 'true');
        
        // Use minimal configuration - don't override anything the widget doesn't need
        console.log(`Creating widget with agent ID: ${agentId} and simple dynamic variables`);
        
        // Apply styling directly to the widget element
        newWidget.style.width = '100%';
        newWidget.style.height = '100%';
        newWidget.style.minHeight = '400px';
        newWidget.style.boxShadow = 'none';
        newWidget.style.border = 'none';
        newWidget.style.borderRadius = '10px';
        
        // Basic event listeners for the widget - add these BEFORE appending to DOM
        newWidget.addEventListener('error', (event) => {
          console.error('Widget error:', event.detail || event);
        });
        
        newWidget.addEventListener('disconnected', (event) => {
          console.log('Widget disconnected:', event.detail || 'No details available');
        });
        
        // Add to container
        widgetContainer.appendChild(newWidget);
        
        // Create a style to hide branding elements
        const styleNode = document.createElement('style');
        styleNode.textContent = `
          #coaching-widget elevenlabs-convai {
            width: 100% !important;
            height: 100% !important;
            z-index: 10 !important;
            position: relative !important;
          }
          
          .el-brand, .el-logo, [class*="elevenlabs"], [class*="convai"], elevenlabs-convai > div > div > div:nth-child(2) {
            display: none !important;
          }
        `;
        document.head.appendChild(styleNode);
        
        // Add event listeners to track widget state
        newWidget.addEventListener('ready', function() {
          console.log('Widget is ready');
          showStatus('Connected to coach!', 'success');
          resolve(true);
        });
        
        newWidget.addEventListener('error', function(event) {
          const errorDetail = event.detail || 'Unknown error';
          console.error('Widget error:', errorDetail);
          
          // Special handling for config-related errors
          if (errorDetail.includes('config') || errorDetail.includes('404')) {
            console.warn('Widget config error detected - this is expected in local testing');
            console.log('Using local widget configuration instead...');
            
            // Force widget to use local config
            setTimeout(() => {
              try {
                // Inject agent configuration directly into widget's internal state
                if (newWidget._widgetInstance && typeof newWidget._widgetInstance.setConfig === 'function') {
                  newWidget._widgetInstance.setConfig(window._elevenLabsWidgetConfig);
                  console.log('Successfully injected local config into widget');
                  showStatus('Using local configuration', 'connecting');
                }
              } catch (e) {
                console.error('Error injecting local config:', e);
              }
              
              // Don't reject the promise for config errors - let it try to recover
              showStatus('Attempting to use local configuration...', 'connecting');
            }, 1000);
          } else {
            // For other errors, reject as usual
            showStatus('Error connecting to coach', 'error');
            reject(new Error('Widget error: ' + errorDetail));
          }
        });
        
        newWidget.addEventListener('connected', () => {
          console.log('Widget successfully connected to ElevenLabs');
          showStatus('Coaching session connected!', 'success');
        });
        
        newWidget.addEventListener('disconnected', (event) => {
          console.log('Widget disconnected:', event.detail || 'No details available');
          if (event.detail && event.detail.includes('Invalid message')) {
            showStatus('Connection error. Please refresh and try again.', 'error');
          }
        });
        
        // Add MutationObserver for video synchronization
        const observer = new MutationObserver((mutations) => {
          const isAgentTalking = mutations.some(m => 
            m.target.getAttribute('data-agent-speaking') === 'true' || 
            m.target.getAttribute('data-agent-talking') === 'true'
          );
          
          // Show coach video when agent is talking
          if (isAgentTalking && !coachVideoVisible) {
            showCoachVideo();
          }
        });
        
        // Start observing after a short delay to ensure element is ready
        setTimeout(() => {
          if (newWidget) {
            observer.observe(newWidget, { 
              attributes: true, 
              attributeFilter: ['data-agent-speaking', 'data-agent-talking'] 
            });
          }
        }, 1000);
        
        // Success callback
        console.log('Widget initialized with agent ID:', agentId);
        showStatus('Initializing coaching session...', 'connecting');
        
        // Set a timeout to resolve even if the 'ready' event doesn't fire
        setTimeout(() => {
          if (widgetContainer.contains(newWidget)) {
            console.log('Widget initialization timeout reached, but widget exists');
            resolve(true);
          }
        }, 5000);
        
        return true;
      } catch (error) {
        console.error('Error initializing widget:', error);
        showStatus('Failed to initialize coaching session', 'error');
        reject(error);
      }
    });
  }
  
  // Function to show coach video
  function showCoachVideo() {
    const coachVideo = document.querySelector('.coach-video');
    const coachId = dynamicVariables.coach_id || 'niles';
    
    // Normalize coach ID to lowercase for image path consistency
    const normalizedCoachId = coachId.toLowerCase();
    console.log(`Showing coach video for: ${normalizedCoachId}`);
    
    // Check if image exists first
    const img = new Image();
    img.onload = function() {
      // Image exists, set it as background
      coachVideo.style.backgroundImage = `url('${normalizedCoachId}-session.png')`;
      coachVideo.style.display = 'flex';
      coachVideoVisible = true;
    };
    
    img.onerror = function() {
      // If specific image not found, try alternative filenames
      console.warn(`Could not load ${normalizedCoachId}-session.png, trying alternatives`);
      const alternatives = [
        `${normalizedCoachId}.png`,
        `${normalizedCoachId.charAt(0).toUpperCase() + normalizedCoachId.slice(1)}-session.png`,
        `${normalizedCoachId.charAt(0).toUpperCase() + normalizedCoachId.slice(1)}.png`
      ];
      
      // Try each alternative
      tryNextImage(0);
      
      function tryNextImage(index) {
        if (index >= alternatives.length) {
          // If no alternatives work, use a default image
          coachVideo.style.backgroundImage = `url('niles-session.png')`;
          coachVideo.style.display = 'flex';
          coachVideoVisible = true;
          console.warn(`Could not find any image for ${normalizedCoachId}, using default`);
          return;
        }
        
        const altImg = new Image();
        altImg.onload = function() {
          coachVideo.style.backgroundImage = `url('${alternatives[index]}')`;
          coachVideo.style.display = 'flex';
          coachVideoVisible = true;
          console.log(`Loaded alternative image: ${alternatives[index]}`);
        };
        
        altImg.onerror = function() {
          // Try next alternative
          tryNextImage(index + 1);
        };
        
        altImg.src = alternatives[index];
      }
    };
    
    img.src = `${normalizedCoachId}-session.png`;
    
    // Update toggle button text
    document.querySelector('.toggle-video').textContent = 'Hide Coach Video';
  }
  
  // Function to hide coach video
  function hideCoachVideo() {
    const coachVideo = document.querySelector('.coach-video');
    coachVideo.style.display = 'none';
    coachVideoVisible = false;
    
    // Update toggle button text
    document.querySelector('.toggle-video').textContent = 'Show Coach Video';
  }
  
  // Function to toggle coach video
  function toggleCoachVideo() {
    if (coachVideoVisible) {
      hideCoachVideo();
    } else {
      showCoachVideo();
    }
  }
  
  // Initialize the session when the page loads
  document.addEventListener('DOMContentLoaded', function() {
    console.log('Coaching Session Page - DOM Content Loaded');
    
    // Get coach details from localStorage
    const coachDetails = JSON.parse(localStorage.getItem('coachDetails') || '{}');
    const coachId = coachDetails.id || 'niles';
    
    // Update coach name in header
    const coachNameElements = document.querySelectorAll('.coach-name');
    coachNameElements.forEach(element => {
      element.textContent = coachDetails.name || 'Coach';
    });
    
    // Update page title
    document.title = `Session with ${coachDetails.name || 'Coach'} - NLI Coaching Practice`;
    
    // Ensure username is properly stored
    let username = localStorage.getItem('username') || localStorage.getItem('userName');
    if (!username) {
      username = 'User';
      localStorage.setItem('username', username);
      localStorage.setItem('userName', username); // For backwards compatibility
    }
    
    // Get or create user ID
    let userId = localStorage.getItem('userId');
    if (!userId) {
      userId = `user_${Math.random().toString(36).substring(2, 15)}`;
      localStorage.setItem('userId', userId);
    }
    
    console.log(`Initializing session with coach: ${coachId}, user: ${username}, ID: ${userId}`);
    
    // Prepare dynamic variables using a SIMPLE FLAT STRUCTURE exactly as in the working implementation
    dynamicVariables = {
      user_name: username,
      user_id: userId,
      session_id: `session_${Date.now()}-${Math.random().toString(36).substring(2, 10)}`,
      coach_id: coachId.toLowerCase(),
      coach_name: coachDetails.name || 'Coach',
      coach_gender: coachDetails.gender || 'neutral',
      coach_accent: coachDetails.accent || 'american',
      coach_style: coachDetails.style || 'balanced',
      coach_role: coachDetails.title || 'Executive Coach',
      personalization: {
        industry: coachDetails.industries || 'Technology',
        level: localStorage.getItem('userLevel') || 'Mid-Level Manager',
        focus_area: coachDetails.focusArea || 'leadership'
      }
    };
    
    console.log('Using SIMPLIFIED dynamic variables that match working implementation');
    
    // Log dynamic variables for debugging
    console.log('Dynamic variables prepared:', JSON.stringify(dynamicVariables, null, 2));
    
    // Enhanced session initialization sequence with simplified flow and better error handling
    showStatus('Loading coaching resources...', 'connecting');
    
    // Set up video toggle button
    document.querySelector('.toggle-video').addEventListener('click', toggleCoachVideo);
    
    // Step 1: Load the widget script with multiple retries (up to 5 attempts)
    console.log('Step 1: Loading widget script...');
    loadWidgetScript(0, 5)
      .then(() => {
        console.log('Widget script loaded successfully, initializing widget...');
        showStatus('Setting up coaching session...', 'connecting');
        // Step 2: Initialize coaching widget directly - skip the getWidgetConfig step which might be failing
        return initializeCoachingWidget(coachId, dynamicVariables);
      })
      .then(() => {
        console.log('Coaching session initialized successfully');
        showStatus('Coaching session ready', 'success');
        sessionActive = true;
      })
      .catch(error => {
        console.error('Error setting up coaching session:', error);
        showStatus('Error connecting. Please refresh the page.', 'error');
        
        // Try one more time with a delay if it failed
        setTimeout(() => {
          console.log('Attempting to reload widget script after failure...');
          loadWidgetScript(0, 5)
            .then(() => initializeCoachingWidget(coachId, dynamicVariables))
            .then(() => {
              showStatus('Coaching session connected!', 'success');
              sessionActive = true;
            })
            .catch(e => console.error('Final retry failed:', e));
        }, 3000);
      });
    
    // Add window error handler for widget-related errors
    window.addEventListener('error', function(event) {
      if (event.message && (event.message.includes('elevenlabs') || event.message.includes('convai'))) {
        console.error('Widget error detected:', event.message);
        if (!sessionActive) {
          showStatus('Widget error detected. Attempting to recover...', 'error');
        }
      }
    });
    
    // Hide ElevenLabs branding with CSS override
    const brandingStyleFix = document.createElement('style');
    brandingStyleFix.textContent = `
      .el-brand, .el-logo, .el-branding, .el-powered-by, 
      [class*="el-brand"], [class*="el-logo"], [class*="eleven"], [class*="labs"],
      div[class*="elevenlabs"], div[class*="convai"],
      elevenlabs-convai > div > div > div:nth-child(2),
      .elevenlabs-branding, .elevenlabs-logo, .elevenlabs-powered-by {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        height: 0 !important;
        overflow: hidden !important;
      }
    `;
    document.head.appendChild(brandingStyleFix);
  });
</script>
